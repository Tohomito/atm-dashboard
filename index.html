<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ATM Unified Dashboard</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f5f1; --bar:#fffefb; --ink:#141413; --ink2:#5d5b55; --muted:#8a877f; --line:#e3e0d8; --accent:#141413; --accent-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--bar:#1b1b1a;--ink:#f4f3ef;--ink2:#c3c1b9;--muted:#8a877f;--line:#2e2d2a;--accent:#f4f3ef;--accent-ink:#121211}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--bar:#1b1b1a;--ink:#f4f3ef;--ink2:#c3c1b9;--muted:#8a877f;--line:#2e2d2a;--accent:#f4f3ef;--accent-ink:#121211}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.bar{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs a{font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tabs a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font-size:12px;color:var(--muted);flex:1 1 280px;min-width:0}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">ATM Unified Dashboard</div>
  <nav class="tabs" aria-label="Dashboard views">
    <a href="#daily" data-view="daily">Daily social</a>
    <a href="#scorecard" data-view="scorecard">Monthly audience scorecard</a>
  </nav>
  <div class="note" id="note"></div>
</div>
<iframe id="view" title="Dashboard view"></iframe>
<script>
const VIEWS = {
  daily: { src: "daily/", note: "Updates daily from the ATM Daily Social Pulse Google Sheet (Hannah's daily run)." },
  scorecard: { src: "scorecard/", note: "Updates monthly from Rob's Audience Scorecard run. Each chart shows its source and data date." }
};
const frame = document.getElementById("view"), note = document.getElementById("note");
function show() {
  const key = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : "daily";
  document.querySelectorAll(".tabs a").forEach(a => { if (a.dataset.view === key) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  note.textContent = VIEWS[key].note;
  if (frame.dataset.view !== key) { frame.dataset.view = key; frame.src = VIEWS[key].src; }
}
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
